<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — Sophia Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            parchment: { 50: '#fbfaf8', 100: '#f6f3eb', 200: '#eee8d5', 300: '#e1d5b3', 400: '#d2be8c', 500: '#c5a86a' },
                            emerald: { 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
                            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                        },
                        fontFamily: {
                            sans: ['Be Vietnam Pro', 'Inter', 'sans-serif'],
                            serif: ['Source Serif 4', 'serif'],
                            display: ['Playfair Display', 'serif'],
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .loading-spinner { border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; width: 1.15rem; height: 1.15rem; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-loading .loading-spinner { display: inline-block; }
        .btn-loading .btn-text { opacity: 0; }
    </style>
</head>
<body class="bg-[#F8F5EE] text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative">
    
    <!-- Decorative Background Accents -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none opacity-20 -z-10">
        <div class="absolute -top-32 -right-32 w-96 h-96 bg-emerald-900 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-amber-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    </div>

    <!-- Registration Card -->
    <div class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-stone-200 p-8 relative overflow-hidden" id="registerCard">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-950 via-amber-500 to-emerald-950"></div>
        
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-950 text-amber-300 mb-3 hover:scale-105 transition-transform shadow-md">
                <i data-lucide="feather" class="w-6 h-6"></i>
            </a>
            <h1 class="font-display text-3xl font-bold text-emerald-950 mb-1">Trở Thành Độc Giả</h1>
            <p class="text-slate-600 text-sm">Gia nhập không gian minh triết Sophia Codex</p>
        </div>

        <form id="registerForm" action="javascript:void(0);" onsubmit="return false;" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Họ tên hiển thị</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="h-4 w-4"></i>
                    </div>
                    <input type="text" id="name" name="name" required class="w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-emerald-900 focus:border-emerald-900 text-sm bg-stone-50 transition-colors" placeholder="Ví dụ: Marcus Aurelius">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Địa chỉ Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="h-4 w-4"></i>
                    </div>
                    <input type="email" id="email" name="email" required class="w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-emerald-900 focus:border-emerald-900 text-sm bg-stone-50 transition-colors" placeholder="email@example.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="h-4 w-4"></i>
                    </div>
                    <input type="password" id="password" name="password" required minlength="8" class="w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-emerald-900 focus:border-emerald-900 text-sm bg-stone-50 transition-colors" placeholder="Tối thiểu 8 ký tự">
                </div>
            </div>
            
            <div>
                <label for="passwordConfirm" class="block text-sm font-semibold text-slate-700 mb-1">Xác nhận mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="shield-check" class="h-4 w-4"></i>
                    </div>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="8" class="w-full pl-10 pr-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-emerald-900 focus:border-emerald-900 text-sm bg-stone-50 transition-colors" placeholder="Nhập lại mật khẩu">
                </div>
            </div>

            <div class="flex items-start pt-1">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required class="focus:ring-emerald-900 h-4 w-4 text-emerald-950 border-stone-300 rounded">
                </div>
                <div class="ml-2 text-xs text-slate-600">
                    <label for="terms">Tôi đồng ý với <a href="terms.html" target="_blank" class="text-emerald-900 font-semibold underline hover:no-underline">Điều khoản sử dụng</a> & <a href="privacy.html" target="_blank" class="text-emerald-900 font-semibold underline hover:no-underline">Quy tắc cộng đồng</a>.</label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-4 flex justify-center items-center py-2.5 px-4 rounded-lg shadow-md text-sm font-semibold text-amber-200 bg-emerald-950 hover:bg-emerald-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-900 transition-colors relative border border-amber-600/30">
                <span class="btn-text">Đăng Ký Tài Khoản</span>
                <span class="loading-spinner absolute"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-slate-600">Đã có tài khoản?</span>
            <a href="login.html" class="font-semibold text-emerald-900 hover:underline ml-1">Đăng nhập ngay</a>
        </div>
        
        <div class="mt-6 pt-4 border-t border-stone-200 text-center">
            <a href="index.html" class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-emerald-950 transition-colors">
                <i data-lucide="arrow-left" class="h-3.5 w-3.5 mr-1"></i> Trở về Thư viện Độc giả
            </a>
        </div>
    </div>
    
    <!-- Success Message Container -->
    <div id="successCard" class="hidden max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-stone-200 p-8 text-center space-y-4">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-950 rounded-full flex items-center justify-center mx-auto border border-emerald-300">
            <i data-lucide="mail-check" class="h-8 w-8 text-emerald-900"></i>
        </div>
        <h2 class="font-display text-2xl font-bold text-emerald-950">Đăng Ký Thành Công!</h2>
        <p class="text-slate-600 text-sm leading-relaxed" id="successMsg">Tài khoản của bạn đã được khởi tạo thành công!</p>
        <a href="login.html" class="w-full inline-flex justify-center items-center py-2.5 px-4 rounded-lg shadow-md text-sm font-semibold text-amber-200 bg-emerald-950 hover:bg-emerald-900 transition-colors">
            Đến Trang Đăng Nhập
        </a>
    </div>

    <script src="js/core/api.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/dom.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const btn = document.getElementById('submitBtn');
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value;
            const pwdConf = document.getElementById('passwordConfirm').value;

            if (pwd !== pwdConf) {
                if (typeof Toast !== 'undefined') Toast.error('Mật khẩu xác nhận không khớp!');
                else alert('Mật khẩu xác nhận không khớp!');
                return false;
            }

            btn.classList.add('btn-loading');
            btn.disabled = true;

            try {
                let success = false;
                if (window.location.protocol.startsWith('http') && typeof API !== 'undefined') {
                    try {
                        await API.post('/auth/register', { 
                            displayName: name, 
                            name: name,
                            email: email, 
                            password: pwd 
                        });
                        // Đồng thời ghi vào AuthStore client để sẵn sàng nếu offline
                        if (typeof AuthStore !== 'undefined') {
                            await AuthStore.register({ displayName: name, email, password: pwd });
                        }
                        success = true;
                    } catch (apiErr) {
                        // Nếu là lỗi nghiệp vụ từ server (email đã tồn tại, validate thất bại), hiển thị lỗi và dừng
                        if (apiErr.status === 400 || (apiErr.message && !apiErr.message.includes('NETWORK_ERROR') && !apiErr.message.includes('Không thể kết nối'))) {
                            throw apiErr;
                        }
                        // Nếu mạng ngắt kết nối hoàn toàn, lưu vào AuthStore cục bộ
                        if (typeof AuthStore !== 'undefined') {
                            const localRes = await AuthStore.register({ displayName: name, email, password: pwd });
                            if (!localRes.success) {
                                throw new Error(localRes.error);
                            }
                            success = true;
                        } else {
                            throw apiErr;
                        }
                    }
                } else {
                    // Chế độ mở tệp trực tiếp / file:///
                    if (typeof AuthStore !== 'undefined') {
                        const localRes = await AuthStore.register({ displayName: name, email, password: pwd });
                        if (!localRes.success) {
                            throw new Error(localRes.error);
                        }
                        success = true;
                    } else {
                        throw new Error('Không thể khởi tạo cơ sở dữ liệu xác thực.');
                    }
                }

                if (success) {
                    document.getElementById('registerCard').classList.add('hidden');
                    document.getElementById('successCard').classList.remove('hidden');
                    document.getElementById('successMsg').innerText = `Tài khoản ${name} (${email}) đã sẵn sàng! Bạn có thể đăng nhập ngay.`;
                }
            } catch (error) {
                console.error(error);
                const msg = error.message || 'Đăng ký thất bại. Email có thể đã tồn tại.';
                if (typeof Toast !== 'undefined') {
                    Toast.error(msg);
                } else {
                    alert(msg);
                }
            } finally {
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
            return false;
        });
    </script>
</body>
</html>
