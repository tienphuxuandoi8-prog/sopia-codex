<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="gothicBlackBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2E1B1B"/>
      <stop offset="60%" stop-color="#190D0D"/>
      <stop offset="100%" stop-color="#080404"/>
    </radialGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3"/>
      <stop offset="30%" stop-color="#E2B13C"/>
      <stop offset="60%" stop-color="#A8771A"/>
      <stop offset="100%" stop-color="#FAD673"/>
    </linearGradient>
    <linearGradient id="spineShadow4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="embossFilter4">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="400" height="560" rx="8" fill="url(#gothicBlackBg)"/>
  <rect x="0" y="0" width="22" height="560" fill="url(#spineShadow4)"/>

  <!-- Spine Ribs -->
  <line x1="0" y1="90" x2="22" y2="90" stroke="#000000" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="190" x2="22" y2="190" stroke="#000000" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="290" x2="22" y2="290" stroke="#000000" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="390" x2="22" y2="390" stroke="#000000" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="490" x2="22" y2="490" stroke="#000000" stroke-width="3" opacity="0.7"/>

  <!-- Outer Frame -->
  <rect x="30" y="24" width="344" height="512" rx="4" fill="none" stroke="url(#goldGrad4)" stroke-width="3" filter="url(#embossFilter4)"/>
  <rect x="36" y="30" width="332" height="500" rx="2" fill="none" stroke="url(#goldGrad4)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- Top Header -->
  <text x="202" y="80" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="10" letter-spacing="4" font-weight="bold" filter="url(#embossFilter4)">
    EIN BUCH FÜR ALLE UND KEINEN
  </text>
  <line x1="130" y1="92" x2="274" y2="92" stroke="url(#goldGrad4)" stroke-width="1" opacity="0.7"/>

  <!-- Author Name -->
  <text x="202" y="145" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="18" letter-spacing="5" font-weight="bold" filter="url(#embossFilter4)">
    FRIEDRICH NIETZSCHE
  </text>
  <text x="202" y="168" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Times New Roman', serif" font-style="italic" font-size="12" letter-spacing="3" opacity="0.9">
    Also sprach Zarathustra
  </text>

  <!-- Central Alpine Mountain & Radiant Sun Medallion -->
  <g transform="translate(202, 260)" filter="url(#embossFilter4)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldGrad4)" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad4)" stroke-width="1"/>
    
    <!-- Radiant Sun Rays -->
    <path d="M 0 -44 L 0 -36 M 31 -31 L 25 -25 M 44 0 L 36 0 M 31 31 L 25 25 M 0 44 L 0 36 M -31 31 L -25 25 M -44 0 L -36 0 M -31 -31 L -25 -25" stroke="url(#goldGrad4)" stroke-width="1.5"/>
    
    <!-- Alpine Mountain Peaks (Đỉnh núi Zarathustra) -->
    <path d="M -34 24 L -12 -12 L 4 6 L 16 -18 L 34 24 Z" fill="none" stroke="url(#goldGrad4)" stroke-width="2"/>
    <!-- Soaring Eagle Silhouette -->
    <path d="M -8 -26 C -4 -30 0 -28 0 -28 C 0 -28 4 -30 8 -26 C 4 -24 0 -25 0 -25 C 0 -25 -4 -24 -8 -26 Z" fill="url(#goldGrad4)"/>
  </g>

  <!-- Title -->
  <text x="202" y="365" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="25" letter-spacing="2" font-weight="bold" filter="url(#embossFilter4)">
    ZARATHUSTRA
  </text>
  <text x="202" y="395" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="18" letter-spacing="2" font-weight="bold" filter="url(#embossFilter4)">
    ĐÃ NÓI NHƯ THẾ
  </text>
  
  <text x="202" y="420" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Times New Roman', serif" font-style="italic" font-size="13" letter-spacing="2" opacity="0.9">
    Ý Chí Quyền Lực • Con Người Siêu Việt
  </text>

  <line x1="120" y1="432" x2="284" y2="432" stroke="url(#goldGrad4)" stroke-width="1.5" opacity="0.75"/>
  <circle cx="202" cy="432" r="3" fill="url(#goldGrad4)"/>

  <text x="202" y="465" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="10" letter-spacing="2" opacity="0.85">
    CHỦ NGHĨA HIỆN SINH
  </text>
  <text x="202" y="495" text-anchor="middle" fill="url(#goldGrad4)" font-family="'Cinzel', serif" font-size="9" letter-spacing="3" opacity="0.75">
    CHEMNITZ • MDCCCLXXXV
  </text>
</svg>
