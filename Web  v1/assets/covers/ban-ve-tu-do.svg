<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="victorianGreenBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#193828"/>
      <stop offset="60%" stop-color="#0E2117"/>
      <stop offset="100%" stop-color="#050E09"/>
    </radialGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="30%" stop-color="#E1B745"/>
      <stop offset="60%" stop-color="#9C751E"/>
      <stop offset="100%" stop-color="#F2CE69"/>
    </linearGradient>
    <linearGradient id="spineShadow5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="embossFilter5">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="400" height="560" rx="8" fill="url(#victorianGreenBg)"/>
  <rect x="0" y="0" width="22" height="560" fill="url(#spineShadow5)"/>

  <!-- Spine Ribs -->
  <line x1="0" y1="90" x2="22" y2="90" stroke="#000000" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="190" x2="22" y2="190" stroke="#000000" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="290" x2="22" y2="290" stroke="#000000" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="390" x2="22" y2="390" stroke="#000000" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="490" x2="22" y2="490" stroke="#000000" stroke-width="3" opacity="0.6"/>

  <!-- Victorian Ornamental Gilt Border -->
  <rect x="30" y="24" width="344" height="512" rx="4" fill="none" stroke="url(#goldGrad5)" stroke-width="3" filter="url(#embossFilter5)"/>
  <rect x="38" y="32" width="328" height="496" rx="2" fill="none" stroke="url(#goldGrad5)" stroke-width="1.5" opacity="0.85"/>

  <!-- Top Header -->
  <text x="202" y="80" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Cinzel', serif" font-size="11" letter-spacing="4" font-weight="bold" filter="url(#embossFilter5)">
    VICTORIAN PHILOSOPHICAL ESSAY
  </text>
  <line x1="140" y1="92" x2="264" y2="92" stroke="url(#goldGrad5)" stroke-width="1" opacity="0.7"/>

  <!-- Author Name -->
  <text x="202" y="145" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Cinzel', serif" font-size="20" letter-spacing="5" font-weight="bold" filter="url(#embossFilter5)">
    JOHN STUART MILL
  </text>
  <text x="202" y="168" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Times New Roman', serif" font-style="italic" font-size="12" letter-spacing="3" opacity="0.9">
    Member of Parliament for Westminster
  </text>

  <!-- Central Scales of Justice & Liberty Torch Medallion -->
  <g transform="translate(202, 260)" filter="url(#embossFilter5)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldGrad5)" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad5)" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Balance Scales of Justice -->
    <line x1="0" y1="-26" x2="0" y2="28" stroke="url(#goldGrad5)" stroke-width="2.5"/>
    <line x1="-30" y1="-14" x2="30" y2="-14" stroke="url(#goldGrad5)" stroke-width="2"/>
    <!-- Left Pan -->
    <line x1="-28" y1="-14" x2="-34" y2="6" stroke="url(#goldGrad5)" stroke-width="1"/>
    <line x1="-28" y1="-14" x2="-22" y2="6" stroke="url(#goldGrad5)" stroke-width="1"/>
    <path d="M -36 6 Q -28 14 -20 6 Z" fill="url(#goldGrad5)"/>
    <!-- Right Pan -->
    <line x1="28" y1="-14" x2="22" y2="6" stroke="url(#goldGrad5)" stroke-width="1"/>
    <line x1="28" y1="-14" x2="34" y2="6" stroke="url(#goldGrad5)" stroke-width="1"/>
    <path d="M 20 6 Q 28 14 36 6 Z" fill="url(#goldGrad5)"/>
    <!-- Torch Flame Top -->
    <path d="M 0 -26 C -4 -32 0 -40 0 -40 C 0 -40 4 -32 0 -26 Z" fill="url(#goldGrad5)"/>
  </g>

  <!-- Title -->
  <text x="202" y="375" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Cinzel', serif" font-size="28" letter-spacing="3" font-weight="bold" filter="url(#embossFilter5)">
    BÀN VỀ TỰ DO
  </text>
  <text x="202" y="405" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Times New Roman', serif" font-style="italic" font-size="14" letter-spacing="2" opacity="0.9">
    On Liberty • Tự Do Tư Tưởng
  </text>

  <line x1="120" y1="422" x2="284" y2="422" stroke="url(#goldGrad5)" stroke-width="1.5" opacity="0.75"/>
  <circle cx="202" cy="422" r="3" fill="url(#goldGrad5)"/>

  <text x="202" y="460" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Cinzel', serif" font-size="10" letter-spacing="2" opacity="0.85">
    TRIẾT HỌC KHAI SÁNG ANH
  </text>
  <text x="202" y="495" text-anchor="middle" fill="url(#goldGrad5)" font-family="'Cinzel', serif" font-size="9" letter-spacing="3" opacity="0.75">
    LONDON • MDCCCLIX
  </text>
</svg>
