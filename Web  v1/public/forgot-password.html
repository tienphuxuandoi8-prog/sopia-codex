<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Sopia Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: { 50: '#fbfaf8', 100: '#f6f3eb', 200: '#eee8d5', 300: '#e1d5b3', 400: '#d2be8c', 500: '#c5a86a', 600: '#b78f4f', 700: '#99713e', 800: '#7f5e38', 900: '#674d30' },
                        emerald: { 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Source Serif 4', 'serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .loading-spinner { border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; width: 1.25rem; height: 1.25rem; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-loading .loading-spinner { display: inline-block; }
        .btn-loading .btn-text { opacity: 0; }
    </style>
</head>
<body class="bg-parchment-100 text-slate-800 font-serif antialiased min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-parchment-200 p-8 relative overflow-hidden" id="formCard">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-900 via-gold-500 to-emerald-900"></div>
        
        <div class="text-center mb-8">
            <h1 class="font-display text-2xl font-bold text-emerald-950 mb-2">Quên mật khẩu?</h1>
            <p class="text-slate-600 font-sans text-sm">Nhập email của bạn và chúng tôi sẽ gửi liên kết để đặt lại mật khẩu.</p>
        </div>

        <form id="forgotForm" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 font-sans mb-1">Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="email" id="email" name="email" required class="block w-full pl-10 pr-3 py-2 border border-parchment-300 rounded-lg focus:ring-emerald-900 focus:border-emerald-900 font-sans sm:text-sm bg-parchment-50 transition-colors" placeholder="email@example.com">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-parchment-50 bg-emerald-950 hover:bg-emerald-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-900 font-sans transition-colors relative">
                <span class="btn-text">Gửi liên kết</span>
                <span class="loading-spinner absolute"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm font-sans">
            <a href="/login.html" class="inline-flex items-center font-medium text-emerald-800 hover:text-emerald-950 hover:underline">
                <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i> Quay lại Đăng nhập
            </a>
        </div>
    </div>

    <!-- Success Message Container -->
    <div id="successCard" class="hidden max-w-md w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-parchment-200 p-8 text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-950 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="mail-check" class="h-8 w-8"></i>
        </div>
        <h2 class="font-display text-2xl font-bold text-emerald-950 mb-4">Đã gửi yêu cầu</h2>
        <p class="text-slate-600 font-sans text-sm mb-6">Nếu email tồn tại trong hệ thống, liên kết đặt lại mật khẩu đã được gửi đến bạn. Vui lòng kiểm tra hộp thư (cả mục Spam).</p>
        <a href="/login.html" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-parchment-50 bg-emerald-950 hover:bg-emerald-900 font-sans transition-colors">
            Trở về Đăng nhập
        </a>
    </div>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/core/dom.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;

            btn.classList.add('btn-loading');
            btn.disabled = true;

            try {
                if (typeof API !== 'undefined') {
                    await API.post('/auth/forgot-password', { email });
                    document.getElementById('formCard').classList.add('hidden');
                    document.getElementById('successCard').classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                if (typeof Toast !== 'undefined') {
                    Toast.error(error.message || 'Đã xảy ra lỗi. Vui lòng thử lại.');
                } else {
                    alert(error.message || 'Lỗi hệ thống.');
                }
            } finally {
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
