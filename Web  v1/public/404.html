<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Con Đường Chưa Từng Tồn Tại - Sophia Codex</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color, #faf9f6);
            color: var(--text-color, #2c2c2c);
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-muted, #666);
            margin-bottom: 2rem;
        }
        a.btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: var(--primary-color, #1a1a1a);
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        a.btn:hover {
            background-color: var(--primary-hover, #333);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404 - Con Đường Chưa Từng Tồn Tại</h1>
        <p>Marcus Aurelius từng chiêm nghiệm: "Mọi thứ ta nhìn thấy chỉ là một góc nhìn, không phải chân lý." Có lẽ trang bạn tìm kiếm đã trôi dạt vào dòng chảy vô định của thời gian.</p>
        <a href="/" class="btn">← Trở Về Với Thực Tại (Thư Viện)</a>
    </div>
</body>
</html>
