<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email - Sopia Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: { 50: '#fbfaf8', 100: '#f6f3eb', 200: '#eee8d5', 300: '#e1d5b3', 400: '#d2be8c', 500: '#c5a86a', 600: '#b78f4f', 700: '#99713e', 800: '#7f5e38', 900: '#674d30' },
                        emerald: { 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Source Serif 4', 'serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .loader {
            border: 4px solid #eee8d5;
            border-top: 4px solid #064e3b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-parchment-100 text-slate-800 font-serif antialiased min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-parchment-200 p-8 text-center relative overflow-hidden" id="card">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-900 via-gold-500 to-emerald-900"></div>
        
        <div id="loadingState">
            <div class="loader mb-4"></div>
            <h2 class="font-display text-xl font-bold text-emerald-950 mb-2">Đang xác thực email...</h2>
            <p class="text-slate-600 font-sans text-sm">Vui lòng chờ trong giây lát.</p>
        </div>

        <div id="successState" class="hidden">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-950 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle" class="h-8 w-8"></i>
            </div>
            <h2 class="font-display text-2xl font-bold text-emerald-950 mb-4">Thành công!</h2>
            <p class="text-slate-600 font-sans text-sm mb-6">Tài khoản của bạn đã được kích hoạt thành công!</p>
            <a href="/login.html" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-parchment-50 bg-emerald-950 hover:bg-emerald-900 font-sans transition-colors">
                Đăng nhập ngay
            </a>
        </div>

        <div id="errorState" class="hidden">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="x-circle" class="h-8 w-8"></i>
            </div>
            <h2 class="font-display text-2xl font-bold text-red-700 mb-4">Xác thực thất bại</h2>
            <p class="text-slate-600 font-sans text-sm mb-6" id="errorMsg">Liên kết không hợp lệ hoặc đã hết hạn.</p>
            <button id="resendBtn" class="w-full flex justify-center items-center py-2.5 px-4 border border-emerald-950 rounded-lg shadow-sm text-sm font-medium text-emerald-950 bg-transparent hover:bg-emerald-50 font-sans transition-colors">
                Yêu cầu gửi lại email
            </button>
        </div>
    </div>

    <!-- Modal for resend -->
    <div id="resendModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="font-display text-lg font-bold text-emerald-950 mb-4">Gửi lại email xác thực</h3>
            <input type="email" id="resendEmail" class="block w-full px-3 py-2 border border-parchment-300 rounded-lg focus:ring-emerald-900 focus:border-emerald-900 font-sans sm:text-sm mb-4" placeholder="Nhập email của bạn">
            <div class="flex space-x-3">
                <button id="closeModal" class="flex-1 py-2 bg-slate-100 text-slate-700 rounded-lg font-sans text-sm font-medium">Hủy</button>
                <button id="submitResend" class="flex-1 py-2 bg-emerald-950 text-white rounded-lg font-sans text-sm font-medium">Gửi lại</button>
            </div>
        </div>
    </div>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/core/dom.js"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const token = new URLSearchParams(window.location.search).get('token');
            const loading = document.getElementById('loadingState');
            const success = document.getElementById('successState');
            const error = document.getElementById('errorState');
            
            if (!token) {
                loading.classList.add('hidden');
                error.classList.remove('hidden');
                return;
            }

            try {
                if (typeof API !== 'undefined') {
                    await API.post('/auth/verify-email', { token });
                    loading.classList.add('hidden');
                    success.classList.remove('hidden');
                }
            } catch (err) {
                loading.classList.add('hidden');
                error.classList.remove('hidden');
                document.getElementById('errorMsg').innerText = err.message || "Liên kết không hợp lệ hoặc đã hết hạn.";
            }
        });

        // Modal logic
        const modal = document.getElementById('resendModal');
        document.getElementById('resendBtn').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('closeModal').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('submitResend').addEventListener('click', async () => {
            const email = document.getElementById('resendEmail').value;
            if(!email) return;
            try {
                await API.post('/auth/resend-verification', { email });
                if (typeof Toast !== 'undefined') Toast.success('Đã gửi lại email. Vui lòng kiểm tra hộp thư.');
                else alert('Đã gửi lại email!');
                modal.classList.add('hidden');
            } catch (err) {
                if (typeof Toast !== 'undefined') Toast.error(err.message || 'Lỗi gửi lại email');
                else alert(err.message);
            }
        });
    </script>
</body>
</html>
