<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Sopia Codex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: { 50: '#fbfaf8', 100: '#f6f3eb', 200: '#eee8d5', 300: '#e1d5b3', 400: '#d2be8c', 500: '#c5a86a', 600: '#b78f4f', 700: '#99713e', 800: '#7f5e38', 900: '#674d30' },
                        emerald: { 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Source Serif 4', 'serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .loading-spinner { border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; width: 1.25rem; height: 1.25rem; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-loading .loading-spinner { display: inline-block; }
        .btn-loading .btn-text { opacity: 0; }
    </style>
</head>
<body class="bg-parchment-100 text-slate-800 font-serif antialiased min-h-screen flex items-center justify-center p-4 relative">
    <!-- Background accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none opacity-20">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-900 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-gold-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    </div>

    <div class="max-w-md w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-parchment-200 p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-900 via-gold-500 to-emerald-900"></div>
        
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-950 text-parchment-100 mb-4 hover:scale-105 transition-transform">
                <i data-lucide="feather"></i>
            </a>
            <h1 class="font-display text-3xl font-bold text-emerald-950 mb-2">Sophia Codex</h1>
            <p class="text-slate-600 font-sans text-sm">Hành trình chiêm nghiệm bắt đầu từ đây</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 font-sans mb-1">Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="email" id="email" name="email" required class="block w-full pl-10 pr-3 py-2 border border-parchment-300 rounded-lg focus:ring-emerald-900 focus:border-emerald-900 font-sans sm:text-sm bg-parchment-50 transition-colors" placeholder="email@example.com">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-sm font-medium text-slate-700 font-sans">Mật khẩu</label>
                    <a href="/forgot-password.html" class="text-xs font-sans text-emerald-800 hover:text-emerald-950 hover:underline">Quên mật khẩu?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="password" id="password" name="password" required class="block w-full pl-10 pr-10 py-2 border border-parchment-300 rounded-lg focus:ring-emerald-900 focus:border-emerald-900 font-sans sm:text-sm bg-parchment-50 transition-colors" placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i data-lucide="eye" class="h-5 w-5" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-parchment-50 bg-emerald-950 hover:bg-emerald-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-900 font-sans transition-colors relative">
                <span class="btn-text">Đăng nhập</span>
                <span class="loading-spinner absolute"></span>
            </button>
        </form>

        <div class="mt-6 text-center text-sm font-sans">
            <span class="text-slate-600">Chưa có tài khoản?</span>
            <a href="/register.html" class="font-medium text-emerald-800 hover:text-emerald-950 hover:underline ml-1">Đăng ký ngay</a>
        </div>
        
        <div class="mt-8 pt-6 border-t border-parchment-200 text-center">
            <a href="/" class="inline-flex items-center text-sm font-sans text-slate-500 hover:text-emerald-950 transition-colors">
                <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i> Về Thư viện Độc giả
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/core/dom.js"></script>
    <script>
        lucide.createIcons();

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof Auth !== 'undefined' && await Auth.isLoggedIn()) {
                const next = new URLSearchParams(window.location.search).get('next') || '/';
                window.location.href = next;
            }
        });

        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Re-render icon
            eyeIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons({ nameAttr: 'data-lucide', attrs: { class: 'h-5 w-5' } });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;

            btn.classList.add('btn-loading');
            btn.disabled = true;

            try {
                if (typeof API !== 'undefined') {
                    const res = await API.post('/auth/login', { email, password: pwd });
                    if (res) {
                        if (typeof Toast !== 'undefined') Toast.success('Đăng nhập thành công!');
                        if (typeof Auth !== 'undefined') await Auth.loadMe();
                        const next = new URLSearchParams(window.location.search).get('next') || '/';
                        setTimeout(() => { window.location.href = next; }, 500);
                    }
                } else {
                    console.error("API module not loaded");
                    alert("Đăng nhập thất bại, vui lòng thử lại sau.");
                }
            } catch (error) {
                console.error(error);
                if (typeof Toast !== 'undefined') {
                    Toast.error(error.message || 'Đăng nhập thất bại. Kiểm tra lại thông tin.');
                } else {
                    alert(error.message || 'Đăng nhập thất bại.');
                }
            } finally {
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
